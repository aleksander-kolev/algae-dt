# Shared parameters for all algae_dt nodes (loaded by bringup.launch.py via the /** wildcard).
# Tunables live here — nodes NEVER hardcode them (RULES.md §C). Each value gives its provenance AND
# a rationale (why this magnitude is acceptable for the twin), per the rubric's "documented
# tolerance thresholds" requirement. Map dims verified against maps/map.pgm header (P5 86 110 255).
/**:
  ros__parameters:
    # --- mode (overridden by the launch arg) ---
    mode: sim_only                 # sim_only | real_only | both

    # --- command bus TYPE CONTRACT (Jazzy, doc-confirmed) ---
    # /dt/cmd_vel_raw is geometry_msgs/TwistStamped: on Jazzy the real turtlebot3_node subscribes
    # TwistStamped (enable_stamped_cmd_vel:true in burger.yaml) and turtlebot3_teleop publishes
    # TwistStamped. Nav2 on Jazzy defaults to plain Twist, so a Nav2 params_file sets
    # enable_stamped_cmd_vel:true on controller/behavior/velocity_smoother AND we remap its cmd_vel
    # onto /dt/cmd_vel_raw in the launch. Mediator forwards TwistStamped->real /cmd_vel + verified
    # type ->/sim/cmd_vel. (RULES §B-1/B-2; matches the course Lidar-DT Mini-Project-3 bus.)

    # --- safety / motion (Rubric ③, course 25 cm dual-LiDAR stop) ---
    stop_distance_m: 0.25          # course Lidar-DT spec. Rationale: >LDS-02 min (0.12) + footprint
                                   # margin; matches the course mini-project so behaviour is comparable.
    front_sector_rad: 0.70         # FULL cone width treated as "ahead" (= +/-0.35 rad half-angle).
                                   # safety.front_min_range MUST treat this as full-width (test pins it).
    max_linear_mps: 0.22           # Burger hardware max forward speed.
    max_angular_radps: 2.0         # capped below the 2.84 hardware max for smoothness.
    scan_range_min_m: 0.12         # LDS-02
    scan_range_max_m: 3.5          # LDS-02

    # --- rates ---
    cmd_rate_hz: 20.0
    sync_rate_hz: 5.0
    health_rate_hz: 1.0

    # --- staleness windows (fail-safe: stale considered-scan => blocked) ---
    max_cmd_age_s: 0.5
    max_data_age_s: 1.0

    # --- STATE SYNC & TOLERANCES (Rubric ②: documented thresholds + alerts) ---
    tol_pose_xy_m: 0.15           # real-vs-sim XY tol. Rationale: ~AMCL/odom noise floor on the
                                  # LDS-02 + 0.05 m map cell; tighter would alert on benign jitter.
    tol_pose_yaw_rad: 0.26        # ~15 deg. Rationale: heading noise under in-place spin + AMCL spread.
    tol_sensor_range_m: 0.20      # real-vs-sim front-range discrepancy. Rationale: sim vs LDS-02 noise.
    latency_budget_ms: 250.0      # command->motion + scan-age budget. Rationale: 20 Hz cmd loop (50 ms)
                                  # + DDS/Wi-Fi over AP2IRR10; >250 ms means a real desync to flag.
    stop_skew_ms: 300.0           # max allowed real-stop vs sim-stop time skew on a safety event
                                  # (Rubric ③ "synchronous" — measured, logged to CSV).
    sync_log_csv: "sync_metrics"  # CSV prefix; sync_supervisor appends <prefix>_<stamp>.csv
    sync_log_enable: true
    # command->motion latency method (PLAN T3.1): mediator stamps each /dt/cmd_vel_raw it forwards;
    # sync_supervisor marks motion onset when |odom.twist.linear|>motion_eps_mps OR
    # |angular|>motion_eps_radps, and reports t_motion - t_cmd (clock per mode: sim time in sim_only).
    motion_eps_mps: 0.02
    motion_eps_radps: 0.05
    # sim_only sync source (PLAN T3.1 / RUBRIC ②): with no real robot, the "shadow real pose" is the
    # COMMANDED pose integrated from /dt/cmd_vel_raw; sync error = commanded-vs-achieved sim pose.
    # (Same idea as the synthetic battery below — keeps pillar ② demonstrable in the fallback env.)
    sim_only_sync_source: commanded   # commanded | none

    # --- battery (non-motion state sync) ---
    battery_low_v: 11.0            # GUI battery banner turns AMBER below this (operator_gui, PLAN T4.2).
    battery_critical_v: 10.5       # real battery below this => auto E-STOP on /dt/estop (mediator).
    # synthetic battery for sim_only (so battery state-sync is demonstrable without a robot);
    # OWNED by twin_mediator (publishes /dt/health from this when mode==sim_only):
    battery_sim_start_v: 12.5
    battery_sim_drain_vps: 0.02
    battery_sim_min_v: 11.2        # stays green; demo only

    # --- mission / spray (Rubric ③ task interaction) ---
    spray_seconds: 5.0             # spin-in-place duration at the bloom centre
    spray_omega_radps: 1.0
    bloom_radius_m: 0.15           # drawn marker radius + mission bookkeeping (operator_gui/mission)
    standoff_m: 0.0                # 0 => Nav2 goal IS the bloom centre
    center_tol_m: 0.50             # GROSS arrival sanity bound (sim_only only); Nav2 xy_goal_tolerance
                                   # (0.15) is authoritative. Generous so deceleration pose-lag never
                                   # false-rejects a real arrival.
    nav_goal_timeout_s: 60.0

    # --- map (course mapFiles.zip base map; verified 86x110 @ 0.05 m/px) ---
    map_resolution: 0.05
    map_origin_x: -2.051
    map_origin_y: -4.194
    map_width_px: 86
    map_height_px: 110
