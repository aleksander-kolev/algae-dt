# Shared parameters for all algae_dt nodes (loaded by bringup.launch.py via the /** wildcard).
# Tunables live here — nodes NEVER hardcode them (RULES.md §C). Each value gives its provenance AND
# a rationale (why this magnitude is acceptable for the twin), per the rubric's "documented
# tolerance thresholds" requirement. Map dims verified against maps/map.pgm header (P5 86 110 255).
/**:
  ros__parameters:
    # --- mode (overridden by the launch arg) ---
    mode: sim_only                 # sim_only | real_only | both

    # --- command bus TYPE CONTRACT (Jazzy, doc-confirmed) ---
    # /dt/cmd_vel_raw is geometry_msgs/TwistStamped: on Jazzy the real turtlebot3_node subscribes
    # TwistStamped (enable_stamped_cmd_vel:true in burger.yaml) and turtlebot3_teleop publishes
    # TwistStamped. Nav2 on Jazzy defaults to plain Twist, so a Nav2 params_file sets
    # enable_stamped_cmd_vel:true on controller/behavior/velocity_smoother AND we remap its cmd_vel
    # onto /dt/cmd_vel_raw in the launch. Mediator forwards TwistStamped->real /cmd_vel + verified
    # type ->/sim/cmd_vel. (RULES §B-1/B-2; matches the course Lidar-DT Mini-Project-3 bus.)

    # --- safety / motion (Rubric ③, course 25 cm dual-LiDAR stop) ---
    stop_distance_m: 0.25          # course Lidar-DT spec. Rationale: >LDS-02 min (0.12) + footprint
                                   # margin; matches the course mini-project so behaviour is comparable.
                                   # KNOWN BLIND SPOT: the LDS-02 reports anything closer than its
                                   # 0.12 m range_min as 0.0 = "no return", indistinguishable from
                                   # empty space — the gate cannot see inside 12 cm (documented in
                                   # lib/safety.py; a normal approach stops at 25 cm long before).
    front_sector_rad: 0.70         # FULL cone width treated as "ahead" (= +/-0.35 rad half-angle).
                                   # safety.front_min_range MUST treat this as full-width (test pins it).
                                   # SCOPE: the 25 cm guarantee covers this +/-20 deg cone, NOT the
                                   # robot's front corners — an obstacle at e.g. 30 deg and 0.20 m is
                                   # ungated by design (course value; corners are Nav2 costmap's job).
    max_linear_mps: 0.22           # Burger hardware max forward speed; the mediator clamps Nav2's
                                   # planned max_speed_xy (0.3) down to this real limit (correct, expected).
    max_angular_radps: 2.84        # mediator's FINAL angular clamp (safety authority) = the Burger
                                   # HARDWARE max. Nav2's controller plans at max_vel_theta=1.0 (well
                                   # within this) so there is NO angular divergence on nav; the higher
                                   # ceiling lets the in-place spray spin briskly (visible under a low
                                   # sim real-time-factor). The mediator only ever REDUCES angular for
                                   # the safety gate; forward motion is still capped by max_linear_mps.
    scan_range_min_m: 0.12         # LDS-02
    scan_range_max_m: 3.5          # LDS-02

    # --- rates ---
    cmd_rate_hz: 20.0
    sync_rate_hz: 5.0
    health_rate_hz: 1.0

    # --- staleness windows (fail-safe: stale considered-scan => blocked) ---
    max_cmd_age_s: 0.5
    max_data_age_s: 1.0
    sim_max_data_age_s: 2.0       # looser budget for the MIRROR sim scan in `both` only: the WSL/
                                  # GPU-less sim LiDAR runs ~2.5-3.5 Hz, and one delayed sim frame
                                  # past the real 1.0 s budget would nuisance-stop the REAL robot
                                  # via the OR-gate. The real (safety-critical) scan keeps 1.0 s.
                                  # Matches the 2.0 s the launch grants Nav2's collision_monitor.

    # --- STATE SYNC & TOLERANCES (Rubric ②: documented thresholds + alerts) ---
    tol_pose_xy_m: 0.15           # real-vs-sim XY tol. Rationale: ~AMCL/odom noise floor on the
                                  # LDS-02 + 0.05 m map cell; tighter would alert on benign jitter.
    tol_pose_yaw_rad: 0.26        # ~15 deg. Rationale: heading noise under in-place spin + AMCL spread.
    tol_sensor_range_m: 0.20      # real-vs-sim front-range discrepancy. Rationale: sim vs LDS-02 noise.
    latency_budget_ms: 250.0      # command->motion + scan-age budget. Rationale: 20 Hz cmd loop (50 ms)
                                  # + DDS/Wi-Fi over AP2IRR10; >250 ms means a real desync to flag.
    stop_skew_ms: 300.0           # max allowed real-stop vs sim-stop time skew on a safety event
                                  # (Rubric ③ "synchronous" — measured, logged to CSV, AND alerted).
    stop_skew_window_s: 2.0       # a safety-event stop-skew is measured ONLY between the block's
                                  # rising edge and BOTH worlds coming to rest within this window.
                                  # If a world never stops in time the measurement is abandoned (no
                                  # fabricated number) — this is what keeps the skew tied to the stop
                                  # the block actually caused, never an old/unrelated stop pair.
    sync_pose_timeout_s: 2.0      # if a REQUIRED pose stream is silent/stale this long, the
                                  # supervisor fails loud (sync_ok False + /dt/alerts) rather than
                                  # going dark. Required = real always; sim only in sim_only/both
                                  # (real_only has no sim world — requiring it spammed alerts 5 Hz
                                  # all session and starved the CSV).
    alert_repeat_s: 5.0           # /dt/alerts are edge-triggered; while a condition STAYS true it
                                  # re-alerts at most this often (was: every 5 Hz tick = alert flood).
    sync_log_csv: "sync_metrics"  # CSV prefix; sync_supervisor appends <prefix>_<stamp>.csv
    sync_log_enable: true
    sync_log_dir: "."             # where the Rubric-② evidence CSV lands. '.' = the launch CWD
                                  # (= /ws inside the course container). Set an absolute path for a
                                  # fixed evidence location on the lab laptop.
    sync_log_max_rows: 36000      # ~2 h at 5 Hz, then logging stops with a warning — a forgotten
                                  # node can't fill the (factory-reset-prone) lab disk unbounded.
    # command->motion latency method (PLAN T3.1): sync_supervisor timestamps the rising
    # command-motion edge of /cmd_vel and the matching motion onset of /dt/odom_active
    # (|odom.twist.linear|>motion_eps_mps OR |angular|>motion_eps_radps) BOTH on its OWN clock at
    # message arrival, and reports the difference. ONE observer clock = one time base: header
    # stamps were abandoned because they cross clock domains (Pi wall clock vs laptop wall clock —
    # un-synced over lab Wi-Fi — vs gz sim time) and measured the clock offset, not the latency.
    motion_eps_mps: 0.02
    motion_eps_radps: 0.05
    # sim_only sync source (PLAN T3.1 / RUBRIC ②): with no real robot, the "shadow real pose" is the
    # COMMANDED pose integrated from /dt/cmd_vel_raw; sync error = commanded-vs-achieved sim pose.
    # (Same idea as the synthetic battery below — keeps pillar ② demonstrable in the fallback env.)
    sim_only_sync_source: commanded   # commanded => mediator publishes the integrated-command shadow
                                      # as /dt/real_pose (the sim_only sync source); none => no shadow.

    # --- operator console liveness ---
    gui_alert_hold_s: 0.0          # how long (wall s) the console holds an alert banner RED after
                                   # the last /dt/alerts message. 0 = auto = max(10, 3*alert_repeat_s),
                                   # which keeps a persistent alert visible across the worst
                                   # documented sim real-time-factor (the producer republishes on SIM
                                   # time, the GUI ages on WALL time). Set >0 to pin an explicit hold.
    gui_stale_after_s: 2.0         # /dt/safety doubles as the mediator heartbeat (republished every
                                   # command tick at cmd_rate_hz); silent longer than this -> the
                                   # console's SAFETY/E-STOP banners read UNKNOWN (DT LINK LOST) and
                                   # stale pose/scan overlays stop drawing. A dead mediator or a
                                   # dropped Wi-Fi link must NOT keep looking like a healthy green
                                   # session. 2.0 s = 40x the 20 Hz cmd tick (no false positives),
                                   # small enough to flag a real link drop while the operator watches.

    # --- battery (non-motion state sync) ---
    battery_low_v: 11.0            # GUI battery banner turns AMBER below this (operator_gui, PLAN T4.2).
    battery_critical_v: 10.5       # real battery below this => auto E-STOP on /dt/estop (mediator).
    battery_empty_v: 9.0           # LiPo 0% reference for the GUI gauge (lib.hud.battery_percentage).
    battery_full_v: 12.6           # LiPo 100% reference (3S full charge); single source of truth.
    # synthetic battery for sim_only (so battery state-sync is demonstrable without a robot);
    # OWNED by twin_mediator (publishes /dt/health from this when mode==sim_only):
    battery_sim_start_v: 12.5
    battery_sim_drain_vps: 0.02
    battery_sim_min_v: 11.2        # natural drain floors HERE — above critical (10.5) on purpose, so
                                   # an ordinary sim run never auto-E-STOPs itself. The DEMO_SCRIPT
                                   # battery->auto-E-STOP beat is triggered explicitly instead:
                                   #   ros2 topic pub --once /dt/battery_override_v std_msgs/msg/Float64 "{data: 10.0}"
                                   # (mediator-owned override, sim_only only; <=0 clears it).

    # --- mission / spray (Rubric ③ task interaction) ---
    spray_revolutions: 3.0         # chemical spraying = this many FULL in-place spins at the bloom
                                   # centre (course "spin-spray" task). Duration = revs*2*pi/omega, so
                                   # at spray_omega_radps below that is ~18.8 s; raise omega to spray faster.
    spray_omega_radps: 2.8         # in-place spin rate during spray (just under the 2.84 clamp). Chosen
                                   # high on purpose: under a throttled sim real-time-factor (~0.5) the
                                   # wall-clock spin rate is omega*RTF, so omega=1.0 looked like a slow
                                   # drift (~0.5 rad/s real). 2.8 -> ~1.4 rad/s real = a brisk, visible
                                   # spin; the closed-loop still guarantees exactly spray_revolutions turns.
    spray_stall_timeout_s: 3.0     # PRIMARY anti-stall guard: abort the spray when odom yaw has not
                                   # advanced for this many WALL seconds (frozen odom must not spin
                                   # forever). Unlike a total-time backstop it never fires on a
                                   # merely SLOW sim — any real-time-factor finishes the count as
                                   # long as yaw keeps moving.
    spray_time_margin: 6.0         # belt-and-braces absolute cap = this x the nominal spin time.
                                   # 6.0 covers real-time-factors down to ~0.17 (the old 2.0 had ZERO
                                   # headroom at the documented RTF~0.5 and skipped healthy blooms).
                                   # The spray itself is CLOSED-LOOP on odom yaw (true full count).
    bloom_radius_m: 0.15           # drawn marker radius + mission bookkeeping (operator_gui/mission)
    center_tol_m: 0.50             # GROSS arrival sanity bound (sim_only only); Nav2 xy_goal_tolerance
                                   # (0.15) is authoritative. Generous so deceleration pose-lag never
                                   # false-rejects a real arrival. ALSO the max distance mission_runner
                                   # will project a goal off a wall (a bloom needing a bigger move is
                                   # treated as unreachable and skipped, not chased into the inflation).
    goal_clearance_m: 0.30         # mission_runner projects each bloom goal to the nearest point with
                                   # >= this clearance to any wall (static map), so Nav2 never gets a
                                   # goal inside the costmap inflation/lethal zone (the "bloom near a
                                   # wall -> robot starts then does nothing" fix). Rationale: footprint
                                   # 0.105 m + margin > the 0.25 m safety-gate stop, so the projected
                                   # approach pose is reachable AND clear of the forward-stop gate.
    nav_goal_timeout_s: 60.0

    # --- dynamic obstacle (pillar-III live-change demo tool; launch arg use_dynamic_obstacle) ---
    keepout_radius_m: 0.30         # the <static> box is TELEPORTED (no collision response), so its
                                   # sweep is clamped to keep this clearance from the robot spawn
                                   # (0,0); a centre inside the keep-out refuses to spawn at all.
    box_half_extent_m: 0.15        # obstacle_box.sdf is a 0.3 m box -> 0.15 m half-extent. The
                                   # keep-out is inflated by this so the box FACE (not just its
                                   # dimensionless centre) stays outside keepout_radius_m of (0,0).

    # --- map (course mapFiles.zip base map; verified 86x110 @ 0.05 m/px) ---
    map_resolution: 0.05
    map_origin_x: -2.051
    map_origin_y: -4.194
    map_width_px: 86
    map_height_px: 110
