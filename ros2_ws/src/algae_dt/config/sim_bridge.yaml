# ros_gz bridge for `both` mode: the Gazebo mirror robot lives entirely under /sim/* so it NEVER
# collides with the real robot's bare topics (RULES §B-3 topic-collision rule). Only /clock stays
# global (sim time is shared). Gazebo-side topic names are bare (one robot in the sim world); the
# ROS-side names are namespaced. Mirrors turtlebot3_burger_bridge.yaml with /sim/ prefixes.
- ros_topic_name: "/clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/sim/joint_states"
  gz_topic_name: "joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/sim/odom"
  gz_topic_name: "odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/sim/tf"
  gz_topic_name: "tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "/sim/cmd_vel"
  gz_topic_name: "cmd_vel"
  ros_type_name: "geometry_msgs/msg/TwistStamped"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/sim/imu"
  gz_topic_name: "imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "/sim/scan"
  gz_topic_name: "scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# GROUND-TRUTH model pose (gz world frame == map frame by construction — the arena world is
# built to the course map). /dt/sim_pose in `both` is derived from THIS, not /sim/odom, so a
# twin_resync set_pose teleport genuinely moves the published pose, the LiDAR viewpoint and the
# measured sync error together — and the sync discrepancy carries no sim-odom integration error.
# Source: the PosePublisher system inside worlds/burger_sim_gt.sdf (NOT the scene broadcaster's
# /world/<w>/dynamic_pose/info — its entries leave header.data empty, and the Pose_V->TFMessage
# conversion reads exactly those, so every child_frame_id bridged as '' and the entity filter
# could never match; verified live via docker/probe_ground_truth.sh). PosePublisher fills the
# frame names per pose — the same mechanism that makes the diff-drive `tf` entry above work.
- ros_topic_name: "/sim/ground_truth"
  gz_topic_name: "/model/burger_sim/pose"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS
